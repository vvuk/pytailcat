name: Publish to CodeArtifact

# Uploads the distributions attached to a GitHub release to the private AWS
# CodeArtifact PyPI index shared with Inferno (domain `nura`, repo `python`,
# ai account). Runs automatically when release.yml publishes a release, or
# manually for an existing release-* tag.
#
# Auth is keyless GitHub OIDC, matching inferno's publish-client.yml: the job
# runs in the `production` GitHub Environment (Settings > Environments; only
# `release-*` tags may deploy to it), and the `pytailcat-ci-publish` IAM role's
# trust policy accepts only `repo:vvuk/pytailcat:environment:production`. The
# role is defined in inferno's infra/terraform/global/codeartifact.tf and can
# publish only the pytailcat package. No AWS secrets live in GitHub.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example release-0.1.0)
        required: true

permissions:
  contents: read
  id-token: write   # OIDC token request

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CA_DOMAIN: nura
  CA_DOMAIN_OWNER: '724475142061'
  CA_REPO: python

jobs:
  publish:
    name: Publish ${{ inputs.tag || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      - uses: astral-sh/setup-uv@v7

      - name: Configure AWS credentials via OIDC (publish role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::724475142061:role/pytailcat-ci-publish
          role-session-name: github-actions-publish-pytailcat-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CodeArtifact auth token
        run: |
          set -euo pipefail
          token="$(aws codeartifact get-authorization-token \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_DOMAIN_OWNER" \
            --query authorizationToken --output text)"
          echo "::add-mask::$token"
          echo "CODEARTIFACT_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Publish to CodeArtifact
        # --check-url skips files already present, so re-running is safe.
        run: |
          set -euo pipefail
          publish_url="https://${CA_DOMAIN}-${CA_DOMAIN_OWNER}.d.codeartifact.${AWS_REGION}.amazonaws.com/pypi/${CA_REPO}/"
          uv publish \
            --publish-url "$publish_url" \
            --check-url "${publish_url}simple/" \
            --username aws \
            --password "$CODEARTIFACT_AUTH_TOKEN" \
            dist/*

      - name: Summary
        if: always()
        run: |
          {
            echo "## Publish pytailcat ${TAG#release-} ${{ job.status }}"
            echo ""
            echo "- **Index**: \`${CA_DOMAIN}/${CA_REPO}\` (CodeArtifact, ai account)"
          } >> "$GITHUB_STEP_SUMMARY"
