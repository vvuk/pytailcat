name: Publish to CodeArtifact

# Uploads the distributions attached to a GitHub release to an AWS
# CodeArtifact PyPI repository. Runs automatically when release.yml publishes a
# release, or manually for an existing release-* tag.
#
# Auth is keyless GitHub OIDC, matching inferno's publish-client.yml: the job
# runs in the `production` GitHub Environment (Settings > Environments; only
# `release-*` tags may deploy to it), and the IAM role's trust policy accepts
# only `repo:<this repo>:environment:production`. No AWS secrets live in GitHub.
#
# Configure these repository variables (Settings > Secrets and variables >
# Actions). For the shared Inferno index the role is `pytailcat-ci-publish`,
# defined in inferno's infra/terraform/global/codeartifact.tf.
#
#   AWS_REGION                 e.g. us-east-1
#   AWS_ROLE_ARN               IAM role trusting this repository's OIDC subject
#   CODEARTIFACT_DOMAIN        CodeArtifact domain name
#   CODEARTIFACT_DOMAIN_OWNER  AWS account ID that owns the domain
#   CODEARTIFACT_REPOSITORY    CodeArtifact repository name
#
# The role needs codeartifact:GetAuthorizationToken, GetRepositoryEndpoint,
# ReadFromRepository, PublishPackageVersion, PutPackageMetadata, and
# sts:GetServiceBearerToken.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example release-0.1.0)
        required: true

permissions:
  contents: read
  id-token: write   # OIDC token request

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.tag || github.event.release.tag_name }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist

      - uses: astral-sh/setup-uv@v7

      - name: Configure AWS credentials via OIDC (publish role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-publish-pytailcat-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve CodeArtifact endpoint and token
        id: codeartifact
        run: |
          set -euo pipefail
          endpoint="$(aws codeartifact get-repository-endpoint \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.CODEARTIFACT_DOMAIN_OWNER }}" \
            --repository "${{ vars.CODEARTIFACT_REPOSITORY }}" \
            --format pypi --query repositoryEndpoint --output text)"
          token="$(aws codeartifact get-authorization-token \
            --domain "${{ vars.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ vars.CODEARTIFACT_DOMAIN_OWNER }}" \
            --query authorizationToken --output text)"
          echo "::add-mask::$token"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish to CodeArtifact
        env:
          UV_PUBLISH_URL: ${{ steps.codeartifact.outputs.endpoint }}
          UV_PUBLISH_CHECK_URL: ${{ steps.codeartifact.outputs.endpoint }}simple/
          UV_PUBLISH_USERNAME: aws
          UV_PUBLISH_PASSWORD: ${{ steps.codeartifact.outputs.token }}
        # --check-url skips files already present, so re-running is safe.
        run: uv publish dist/*

      - name: Summary
        if: always()
        run: |
          {
            echo "## Publish pytailcat ${TAG#release-} ${{ job.status }}"
            echo ""
            echo "- **Index**: \`${{ vars.CODEARTIFACT_DOMAIN }}/${{ vars.CODEARTIFACT_REPOSITORY }}\` (CodeArtifact)"
          } >> "$GITHUB_STEP_SUMMARY"
