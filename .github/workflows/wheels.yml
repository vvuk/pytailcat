name: Build wheels

# Reusable workflow that builds the release artifacts: an sdist plus one
# platform wheel per target. Each wheel bundles the compiled Tailcat shared
# library for that platform, so pip selects the matching one automatically.
#
#   pytailcat-X.Y.Z.tar.gz                              sdist (builds with Go)
#   pytailcat-X.Y.Z-py3-none-manylinux_2_28_x86_64.whl  Linux x86_64
#   pytailcat-X.Y.Z-py3-none-manylinux_2_28_aarch64.whl Linux arm64
#   pytailcat-X.Y.Z-py3-none-macosx_12_0_arm64.whl      macOS arm64
#
# Linux wheels are built inside manylinux_2_28 containers and repaired with
# auditwheel so they install on any glibc >= 2.28 distribution. macOS wheels
# target macOS 12, the oldest version Go 1.25+ supports; the build hook stamps
# both the wheel tag and the shared library with MACOSX_DEPLOYMENT_TARGET.
on:
  workflow_call:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed
  TAILCAT_REPOSITORY: ${{ vars.TAILCAT_REPOSITORY || 'vvuk/tailcat' }}
  TAILCAT_REF: ${{ vars.TAILCAT_REF || 'vlad/c-api' }}
  PYTHON_VERSION: '3.12'

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pytailcat
    steps:
      - uses: actions/checkout@v4
        with:
          path: pytailcat
      - name: Check out Tailcat with the C API
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAILCAT_REPOSITORY }}
          ref: ${{ env.TAILCAT_REF }}
          path: tailcat
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: pytailcat/dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Empty for macOS, which builds directly on the runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            plat: manylinux_2_28_x86_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            plat: manylinux_2_28_aarch64
          - name: macos-arm64
            runner: macos-latest
            container: ''
            plat: ''
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    defaults:
      run:
        working-directory: pytailcat
    steps:
      - uses: actions/checkout@v4
        with:
          path: pytailcat
      - name: Check out Tailcat with the C API
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAILCAT_REPOSITORY }}
          ref: ${{ env.TAILCAT_REF }}
          path: tailcat
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailcat/go.mod
          cache-dependency-path: tailcat/go.sum
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv build --wheel
      - name: Repair Linux wheel to a manylinux tag
        if: matrix.plat != ''
        run: |
          auditwheel show dist/*.whl
          auditwheel repair --plat "${{ matrix.plat }}" -w wheelhouse dist/*.whl
          rm dist/*.whl
          mv wheelhouse/*.whl dist/
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: pytailcat/dist/*.whl
          if-no-files-found: error

  # Install each wheel on a plain runner (outside the build container, without
  # Go) and run the smoke test, proving the platform tags are usable.
  check:
    name: Check wheel (${{ matrix.name }})
    needs: wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv run --no-project --python ${{ env.PYTHON_VERSION }} scripts/check_wheel.py --python ${{ env.PYTHON_VERSION }} --wheel dist/*.whl
